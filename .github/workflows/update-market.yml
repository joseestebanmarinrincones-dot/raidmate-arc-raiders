name: Refresh market snapshot

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh marketplace medians
        run: python scripts/build_data.py --market-only --market-limit 180

      - name: Commit market snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/market.json data/meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No market changes."
          else
            git commit -m "chore: refresh market snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare static site
        if: steps.commit.outputs.changed == 'true'
        run: |
          rm -rf .git _site
          mkdir -p _site
          rsync -a \
            --exclude='_site' \
            --exclude='data/raw' \
            --exclude='data/cache' \
            --exclude='__pycache__' \
            --exclude='.github' \
            --exclude='docs' \
            ./ _site/

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
